[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "ramoe"
version = "0.1.0"
description = "RAMoE: reliability-aware IMU and skeleton fusion for scaffold behavior recognition"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "tqdm>=4.66.5",
]

[project.optional-dependencies]
analysis = [
    "xgboost>=3.1.1",
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["models*", "training*", "utils*", "data*", "experiments*"]
namespaces = true

[tool.uv.sources]
torch = { index = "torch-cu130" }

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "torch-cu130"
url = "https://download.pytorch.org/whl/cu130"
